# Produção na VPS: um container nginx com o jogo (`web`) e o serviço de importação
# pelo YouTube (`api`, pasta transcriber/), sem proxy próprio (mesmo arranjo do
# kindred e do gas-individualizado). O nginx do `web` encaminha /api/ para a `api`.
#
# Quem termina o HTTPS é o Caddy compartilhado da VPS (`~/caddy`, repo vps-infra),
# que alcança o container pela rede externa `edge`. Detalhes em docs/deploy-vps.md.
#
# Na VPS (é o que o forced command `~/bin/deploy.sh` roda):
#   IMAGE_TAG=<sha> docker compose -f docker-compose.prod.yml up -d --no-deps web api
services:
  web:
    container_name: piano-web
    image: ghcr.io/jpmvale/piano-web:${IMAGE_TAG:-latest}
    build: .
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - edge

  api:
    container_name: piano-api
    image: ghcr.io/jpmvale/piano-api:${IMAGE_TAG:-latest}
    build: ./transcriber
    expose:
      - "8000"
    restart: unless-stopped
    environment:
      THREADS: "2"
      MAX_MINUTOS: "15"
      MAX_FILA: "5"
      MAX_MB_ENVIO: "60"
      # O YouTube pede login para downloads vindos da VPS. Com o arquivo de
      # cookies em ~/apps/piano-cookies/youtube.txt, o yt-dlp entra como a conta
      # que exportou os cookies (ver transcriber/README.md). Sem o arquivo, segue
      # sem cookies.
      YTDLP_COOKIES: /cookies/youtube.txt
    volumes:
      - piano-dados:/data
      # Fora do repositório (~/apps/piano é um checkout) e só leitura: o
      # yt-dlp trabalha numa cópia.
      - ${HOME}/apps/piano-cookies:/cookies:ro
    # A transcrição chega a ~2 GB no pico; o teto protege os outros apps da VPS.
    mem_limit: 3g
    # Peso baixo na disputa por CPU: se os outros apps precisarem, eles passam
    # na frente e a transcrição só fica mais lenta.
    cpu_shares: 256
    networks:
      - edge

volumes:
  # MIDI já transcritos: reimportar o mesmo vídeo é instantâneo.
  piano-dados:

networks:
  # Rede do proxy compartilhado, criada fora do compose (`docker network create edge`).
  edge:
    external: true
