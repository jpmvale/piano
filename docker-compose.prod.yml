# Produção na VPS: um container nginx com o jogo, sem proxy próprio (mesmo arranjo
# do kindred e do gas-individualizado).
#
# Quem termina o HTTPS é o Caddy compartilhado da VPS (`~/caddy`, repo vps-infra),
# que alcança o container pela rede externa `edge`. Detalhes em docs/deploy-vps.md.
#
# Na VPS (é o que o forced command `~/bin/deploy.sh` roda):
#   IMAGE_TAG=<sha> docker compose -f docker-compose.prod.yml up -d --no-deps web
services:
  web:
    container_name: piano-web
    image: ghcr.io/jpmvale/piano-web:${IMAGE_TAG:-latest}
    build: .
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - edge

networks:
  # Rede do proxy compartilhado, criada fora do compose (`docker network create edge`).
  edge:
    external: true
