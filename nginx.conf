server {
	listen 8080;
	root /usr/share/nginx/html;

	# O deploy.sh da VPS confere duas URLs públicas: a raiz e uma de "api".
	# O piano não tem API, então esta rota faz esse papel e prova que o
	# container responde de verdade pela rede `edge`.
	location = /health {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	location / {
		try_files $uri /index.html;
		# O HTML traz o jogo inteiro embutido: sem cache longo, para um deploy
		# novo aparecer no próximo carregamento.
		add_header Cache-Control "no-cache";
	}
}
