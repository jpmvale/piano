server {
	listen 8080;
	root /usr/share/nginx/html;

	# Rota do próprio nginx, para o healthcheck do container.
	location = /health {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	# Importação pelo YouTube: o serviço `piano-api` (pasta transcriber/).
	# O nome vai numa variável, resolvido pelo DNS do Docker a cada pedido: assim
	# o nginx sobe mesmo sem a api no ar (no CI, por exemplo) e só esta rota
	# responde 502 enquanto ela não existir.
	location /api/ {
		resolver 127.0.0.11 valid=10s ipv6=off;
		set $api http://piano-api:8000;
		proxy_pass $api;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		client_max_body_size 4k;
		add_header Cache-Control "no-store" always;
	}

	# Envio de arquivo de áudio: a única rota que recebe corpo grande. O limite
	# acompanha o MAX_MB_ENVIO da api.
	location = /api/enviar {
		resolver 127.0.0.11 valid=10s ipv6=off;
		set $api http://piano-api:8000;
		proxy_pass $api;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		client_max_body_size 41m;
		proxy_request_buffering off;
		add_header Cache-Control "no-store" always;
	}

	location / {
		try_files $uri /index.html;
		# O HTML traz o jogo inteiro embutido: sem cache longo, para um deploy
		# novo aparecer no próximo carregamento.
		add_header Cache-Control "no-cache";
	}
}
